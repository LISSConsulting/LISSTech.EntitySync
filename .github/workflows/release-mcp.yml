name: Release MCP Server

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.ENTITYSYNC_TEST_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=${{ secrets.ENTITYSYNC_TEST_POSTGRES_PASSWORD }};Pooling=false
      ENTITYSYNC_DATA_PROTECTION_KEY_PATH: /tmp/entitysync-release-keys
      ENTITYSYNC_TENANT_IDS: release-verification
      ENTITYSYNC_WORKER_LEASE_SECONDS: '60'
      ENTITYSYNC_WORKER_HEARTBEAT_SECONDS: '10'
      ENTITYSYNC_WORKER_RETRY_SECONDS: '5'
      ORCHESTRA_BASE_URL: https://orchestra.example.com/api/v1/internal/client-directory/
      ORCHESTRA_AUTHORITY: https://login.example.com
      ORCHESTRA_TENANT_ID: release-verification
      ORCHESTRA_CLIENT_ID: release-verification
      ORCHESTRA_RESOURCE: api://orchestra
      ORCHESTRA_CLIENT_SECRET: ${{ secrets.ENTITYSYNC_TEST_ORCHESTRA_CLIENT_SECRET }}
      MCP_TRANSPORT: http
      MCP_OAUTH_AUTHORITY: https://auth.example.com
      MCP_OAUTH_RESOURCE: https://entitysync.example.com/mcp
      MCP_OAUTH_AUDIENCE: https://entitysync.example.com/mcp
      MCP_OAUTH_SCOPES: mcp:tools
      MCP_OAUTH_REQUIRED_SCOPE: mcp:tools
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: https://logfire-us.pydantic.dev/v1/logs
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.ENTITYSYNC_TEST_OTEL_HEADERS }}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build production API and scheduler images
        run: |
          docker build --file mcp/Dockerfile --tag entitysync-mcp:release-check .
          docker build --file scheduler/Dockerfile --tag entitysync-scheduler:release-check .
          api_image_id="$(docker image inspect --format '{{.Id}}' entitysync-mcp:release-check)"
          scheduler_image_id="$(docker image inspect --format '{{.Id}}' entitysync-scheduler:release-check)"
          test "${api_image_id#sha256:}" != "$api_image_id"
          test "${scheduler_image_id#sha256:}" != "$scheduler_image_id"
          test "$(docker run --rm --entrypoint id entitysync-mcp:release-check -u)" = '1654'
          test "$(docker run --rm --entrypoint id entitysync-scheduler:release-check -u)" = '1654'
          printf 'API image: %s\nScheduler image: %s\n' "$api_image_id" "$scheduler_image_id"

      - name: Run migration, control, and end-to-end tests
        run: >-
          dotnet test
          Tests/LISSTech.EntitySync.Platform.Tests/LISSTech.EntitySync.Platform.Tests.csproj
          --configuration Release
          --verbosity minimal

      - name: Import the exact 16-command PowerShell module
        shell: pwsh
        run: |
          dotnet build src/LISSTech.EntitySync.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-Module ./Build/Module/LISSTech.EntitySync.psd1 -Force
          $expected = @(
            'Connect-EntitySyncProfile',
            'Connect-EntitySyncVendor',
            'Export-EntitySyncPlan',
            'Get-EntitySyncConnection',
            'Get-EntitySyncEntity',
            'Get-EntitySyncLookup',
            'Get-EntitySyncProfile',
            'Import-EntitySyncPlan',
            'Invoke-EntitySyncChain',
            'Invoke-EntitySyncNetSuiteSuiteQL',
            'Invoke-EntitySyncPlan',
            'New-EntitySyncPlan',
            'Remove-EntitySyncProfile',
            'Set-EntitySyncCustomProperty',
            'Set-EntitySyncDefaultProfile',
            'Test-EntitySyncConnection'
          )
          $expected = @($expected | Sort-Object)
          $actual = @(Get-Command -Module LISSTech.EntitySync |
            Select-Object -ExpandProperty Name | Sort-Object -Unique)
          if ($actual.Count -ne 16) {
            throw "Expected 16 imported commands, got $($actual.Count)."
          }
          if (Compare-Object $expected $actual) {
            throw 'Imported command set differs from the exact release contract.'
          }
          $actual

      - name: Run built images and require PostgreSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          api_container=entitysync-mcp-release-check
          scheduler_container=entitysync-scheduler-release-check
          key_volume=entitysync-release-check-keys
          cleanup() {
            docker rm --force "$api_container" "$scheduler_container" >/dev/null 2>&1 || true
            docker volume rm "$key_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker volume create "$key_volume" >/dev/null

          docker run --detach --name "$scheduler_container" \
            --network host \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --mount "type=volume,source=$key_volume,target=/var/lib/entitysync-dataprotection" \
            --env ASPNETCORE_URLS=http://127.0.0.1:18081 \
            --env DATABASE_URL \
            --env ENTITYSYNC_TENANT_IDS \
            --env ENTITYSYNC_WORKER_LEASE_SECONDS \
            --env ENTITYSYNC_WORKER_HEARTBEAT_SECONDS \
            --env ENTITYSYNC_WORKER_RETRY_SECONDS \
            --env ORCHESTRA_BASE_URL \
            --env ORCHESTRA_AUTHORITY \
            --env ORCHESTRA_TENANT_ID \
            --env ORCHESTRA_CLIENT_ID \
            --env ORCHESTRA_RESOURCE \
            --env ORCHESTRA_CLIENT_SECRET \
            --env OTEL_EXPORTER_OTLP_LOGS_ENDPOINT \
            --env OTEL_EXPORTER_OTLP_HEADERS \
            --env OTEL_EXPORTER_OTLP_PROTOCOL \
            --env OTEL_SERVICE_NAME=lisstech-entitysync-scheduler-release-check \
            --env ENTITYSYNC_DATA_PROTECTION_KEY_PATH=/var/lib/entitysync-dataprotection \
            entitysync-scheduler:release-check >/dev/null

          docker run --detach --name "$api_container" \
            --network host \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --mount "type=volume,source=$key_volume,target=/var/lib/entitysync-dataprotection" \
            --env ASPNETCORE_URLS=http://127.0.0.1:18080 \
            --env DATABASE_URL \
            --env ENTITYSYNC_TENANT_IDS \
            --env ENTITYSYNC_WORKER_LEASE_SECONDS \
            --env ENTITYSYNC_WORKER_HEARTBEAT_SECONDS \
            --env ENTITYSYNC_WORKER_RETRY_SECONDS \
            --env ORCHESTRA_BASE_URL \
            --env ORCHESTRA_AUTHORITY \
            --env ORCHESTRA_TENANT_ID \
            --env ORCHESTRA_CLIENT_ID \
            --env ORCHESTRA_RESOURCE \
            --env ORCHESTRA_CLIENT_SECRET \
            --env MCP_TRANSPORT \
            --env MCP_OAUTH_AUTHORITY \
            --env MCP_OAUTH_RESOURCE \
            --env MCP_OAUTH_AUDIENCE \
            --env MCP_OAUTH_SCOPES \
            --env MCP_OAUTH_REQUIRED_SCOPE \
            --env OTEL_EXPORTER_OTLP_LOGS_ENDPOINT \
            --env OTEL_EXPORTER_OTLP_HEADERS \
            --env OTEL_EXPORTER_OTLP_PROTOCOL \
            --env OTEL_SERVICE_NAME=lisstech-entitysync-mcp-release-check \
            --env ENTITYSYNC_DATA_PROTECTION_KEY_PATH=/var/lib/entitysync-dataprotection \
            entitysync-mcp:release-check >/dev/null

          test "$(docker inspect --format '{{.Config.User}}' "$api_container")" = '1654:1654'
          test "$(docker inspect --format '{{.Config.User}}' "$scheduler_container")" = '1654:1654'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$api_container")" = 'true'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$scheduler_container")" = 'true'
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$api_container")" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$scheduler_container")" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$api_container")" = '["no-new-privileges"]'
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$scheduler_container")" = '["no-new-privileges"]'

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/health >/dev/null \
                && curl --fail --silent --show-error http://127.0.0.1:18080/health/ready \
                  | tee /tmp/entitysync-ready.json \
                  | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$scheduler_container"
          docker logs "$api_container"
          exit 1

  publish:
    needs: verify-control-plane
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish single-file binary
        shell: pwsh
        run: |
          dotnet publish mcp/LISSTech.EntitySync.Mcp.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Package
        shell: pwsh
        run: |
          $binary = Get-ChildItem publish -Filter 'lisstech-entitysync-mcp*' -File | Select-Object -First 1
          if (-not $binary) { throw 'Binary not found in publish output' }
          $name = "lisstech-entitysync-mcp-${{ matrix.rid }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item $binary.FullName "dist/$name/"
          if ('${{ matrix.archive }}' -eq 'zip') {
            Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          } else {
            tar -czf "dist/$name.tar.gz" -C "dist" "$name"
          }
          $hash = (Get-FileHash "dist/$name.${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -NoNewline "dist/$name.${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lisstech-entitysync-mcp-${{ matrix.rid }}
          path: |
            dist/lisstech-entitysync-mcp-${{ matrix.rid }}.${{ matrix.archive }}
            dist/lisstech-entitysync-mcp-${{ matrix.rid }}.${{ matrix.archive }}.sha256

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Read win-x64 hash
        id: hash
        run: |
          HASH=$(cat dist/lisstech-entitysync-mcp-win-x64/lisstech-entitysync-mcp-win-x64.zip.sha256)
          echo "win_hash=$HASH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MCP Server ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.sha256

      - name: Publish Scoop manifest to LISSTech/scoop-bucket
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^mcp-v', ''
          $hash = '${{ steps.hash.outputs.win_hash }}'
          $url = "https://github.com/LISSConsulting/LISSTech.EntitySync/releases/download/$tag/lisstech-entitysync-mcp-win-x64.zip"
          $manifest = [ordered]@{
            version = $version
            description = 'LISSTech EntitySync MCP server for guarded vendor entity synchronization.'
            homepage = 'https://github.com/LISSConsulting/LISSTech.EntitySync'
            license = 'Proprietary'
            architecture = [ordered]@{
              '64bit' = [ordered]@{
                url = $url
                hash = $hash
                bin = @(@('lisstech-entitysync-mcp.exe', 'lisstech-entitysync-mcp'))
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 10
          $payload = @{
            message = "Update lisstech-entitysync-mcp for $tag"
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
            branch = 'main'
          }
          $path = 'bucket/lisstech-entitysync-mcp.json'
          $existing = gh api "repos/LISSConsulting/scoop-bucket/contents/$path?ref=main" --jq '.sha' 2>$null
          if ($existing) { $payload.sha = $existing }
          $payloadJson = $payload | ConvertTo-Json
          gh api "repos/LISSConsulting/scoop-bucket/contents/$path" -X PUT -f data=$payloadJson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
